 <!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis tareas</title>
  <script type="module" src="js/app.js"></script>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main>
    <h1>Mis tareas</h1>
     <label for="prioridad">Prioridad de tarea </label>
<select name="prioridad" id="prioridad">
    <option value="alta">Alta</option>
    <option value="media">Media</option>
    <option value="baja">Baja</option>
</select>
     
    <form id="formulario-tarea">
      <label for="titulo">Nueva tarea</label>
      <input id="titulo" type="text" placeholder="Ej. Leer el capítulo 3">
      <button type="submit">Agregar</button>
      <p id="mensaje" aria-live="polite"></p>


    </form>

    <nav aria-label="Filtrar tareas">
      <button type="button" data-filtro="todas">Todas</button>
      <button type="button" data-filtro="pendientes">Pendientes</button>
      <button type="button" data-filtro="completadas">Completadas</button>
      <button type="button" data-filtro="alta">Prioridad alta</button>
<button type="button" data-filtro="media">Prioridad media</button>
<button type="button" data-filtro="baja">Prioridad baja</button>
    </nav>

    <p id="resumen"></p>
    <ul id="lista-tareas"></ul>
  </main>
</body>
</html>
